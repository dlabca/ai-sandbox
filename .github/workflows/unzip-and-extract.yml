name: Unzip and Extract Contents
just_brake
on:
  workflow_dispatch:

jobs:
  unzip-and-extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and sync contents
        run: |
          mkdir -p /tmp/extracted
          unzip -q ai-sandbox-lowpoly.zip -d /tmp/extracted

          SUBDIRS=(/tmp/extracted/*)
          if [ ${#SUBDIRS[@]} -eq 1 ] && [ -d "${SUBDIRS[0]}" ]; then
            SRC="${SUBDIRS[0]}/"
          else
            SRC="/tmp/extracted/"
          fi

          rsync -a "$SRC" "$GITHUB_WORKSPACE/"

          # Odstranění nového workflow souboru ze ZIPu, aby ho GITHUB_TOKEN neblokoval
          rm -rf "$GITHUB_WORKSPACE/.github/workflows/build-apk.yml"
          rm -f "$GITHUB_WORKSPACE/ai-sandbox-lowpoly.zip"

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Extract ai-sandbox-lowpoly contents to repository root" || echo "Nothing to commit"
          git push
