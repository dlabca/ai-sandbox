name: Unzip and Extract Contents

on:
  workflow_dispatch:

jobs:
  unzip-and-extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and sync contents
        run: |
          if [ ! -f "ai-sandbox-lowpoly.zip" ]; then
            echo "::error::Soubor ai-sandbox-lowpoly.zip nebyl v repozitáři nalezen."
            exit 1
          fi

          mkdir -p /tmp/extracted
          unzip -q ai-sandbox-lowpoly.zip -d /tmp/extracted

          # Pokud ZIP obsahuje právě jednu obalovací složku, posuneme se do ní
          SUBDIRS=(/tmp/extracted/*)
          if [ ${#SUBDIRS[@]} -eq 1 ] && [ -d "${SUBDIRS[0]}" ]; then
            SRC="${SUBDIRS[0]}/"
          else
            SRC="/tmp/extracted/"
          fi

          # rsync bezpečně přenese vše včetně skrytých souborů
          rsync -a "$SRC" "$GITHUB_WORKSPACE/"

          rm -f "$GITHUB_WORKSPACE/ai-sandbox-lowpoly.zip"

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Extract ai-sandbox-lowpoly contents to repository root" || echo "Nothing to commit"
          git push
